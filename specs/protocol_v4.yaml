protocol_name: HydroDA-OOD-HyperDA-V4
protocol_version: v4.3-historical-target-adaptation
protocol_freeze_id: hyperda_v4_3_historical_target_adapt_2015_2025_train2015_2021_val2022_test2023_2025
objective: neural_land_DA_increment_emulation
not_objective:
  - generic_soil_moisture_prediction
  - true_soil_moisture_estimation

main_change_from_v4_2: >-
  Target-domain generalization is no longer a few-shot/K-shot support protocol.
  After source/HyperDA training, methods may use the complete held-out target
  historical training period (2015-2021) to build a target-specific operator,
  prompt, adapter, or generated parameter set. The year 2022 is validation;
  final metrics remain restricted to the held-out target evaluation period.

periods:
  # Backward-compatible alias used by some existing scripts.
  # Paper-facing text should call this source_fit/train.
  source_train:
    start: '2015-01-01'
    end: '2021-12-31'
    alias_of: source_fit
    allowed_usage:
      - training_shared_backbone
      - training_source_only_backbone
      - training_source_operator_episode_bank
      - source_fit_normalization
  source_fit:
    start: '2015-01-01'
    end: '2021-12-31'
    allowed_usage:
      - training_shared_backbone
      - training_source_only_backbone
      - training_source_operator_episode_bank
      - source_fit_normalization
  source_val:
    start: '2022-01-01'
    end: '2022-12-31'
    domain_constraint: source_continents_only
    allowed_usage:
      - checkpoint_selection
      - early_stopping
      - hyperparameter_selection
      - architecture_selection
      - source_val_residual_gain_calibration
    forbidden_usage:
      - target_adaptation_fit
      - final_evaluation
      - normalization
  target_train:
    start: '2015-01-01'
    end: '2021-12-31'
    aliases: [target_adapt, target_context, target_support_legacy]
    domain_constraint: held_out_target_continent_only
    allowed_usage:
      - target_specific_operator_construction
      - target_prompt_summary
      - adapter_tuning
      - lora_tuning
      - hyperda_calibration
      - hyperda_refinement
      - generated_parameter_conditioning
    forbidden_usage:
      - source_backbone_training
      - source_operator_episode_bank_training
      - global_normalization
      - checkpoint_selection_unless_preregistered
      - hyperparameter_selection_unless_preregistered
      - architecture_selection
      - final_evaluation
  target_val:
    start: '2022-01-01'
    end: '2022-12-31'
    domain_constraint: held_out_target_continent_only
    allowed_usage:
      - preregistered_target_adaptation_validation
      - adaptation_step_selection_if_declared
    forbidden_usage:
      - source_backbone_training
      - source_operator_episode_bank_training
      - global_normalization
      - final_evaluation
  target_eval:
    start: '2023-01-01'
    end: '2025-12-31'
    aliases: [target_query]
    domain_constraint: held_out_target_continent_only
    allowed_usage:
      - final_offline_evaluation_only
    forbidden_usage:
      - training
      - target_adaptation
      - prompt_construction
      - normalization
      - adaptation_sample_selection
      - early_stopping
      - model_selection
      - hyperparameter_selection
      - threshold_calibration
      - prompt_feature_tuning
      - region_definition

main_adaptation_settings:
  - target_full_train

adaptation_setting_definitions:
  target_full_train:
    target_label_budget: all_labeled_target_DA_cycles_in_target_train_period
    target_period: target_train
    support_subset: none
    notes: >-
      Uses all available target training samples from 2015-2021 for
      target-specific fast generalization/adaptation, then validates on 2022
      if preregistered and evaluates only on 2023-2025.

legacy_few_shot_ablation:
  status: secondary_ablation_not_main_protocol
  K_values: [0, 4, 12]
  K_definition: number_of_labeled_target_DA_analysis_cycles_from_target_train_2015_2021
  support_sampling:
    support_period: 2015-2021
    K0: no_target_analysis_labels_input_side_prompt_only
    K4: one_valid_cycle_per_season_from_target_train_period
    K12: one_valid_cycle_per_month_from_target_train_period

source_training_policy:
  main: use_source_fit_2015_2021_and_source_val_2022
  rationale: >-
    Source validation year 2022 remains reserved for checkpoint, early stopping,
    hyperparameter, and architecture selection. Source fit expands through 2021
    to match the target historical adaptation window while keeping 2022 as the
    clean validation gate.
  secondary_ablation_allowed:
    - expanded_source_fit_2015_2022_extra_data_ablation

leave_one_continent_out:
  - source: [US, CN]
    target: AU
  - source: [US, AU]
    target: CN
  - source: [CN, AU]
    target: US

leakage_forbidden:
  - target_eval_labels_for_training
  - target_eval_labels_for_prompt_construction
  - target_eval_labels_for_normalization
  - target_eval_labels_for_adaptation_sample_selection
  - target_eval_labels_for_early_stopping
  - target_eval_labels_for_model_selection
  - target_eval_labels_for_hyperparameter_selection
  - target_eval_labels_for_threshold_calibration
  - target_eval_labels_for_prompt_feature_tuning
  - analysis_increments_for_region_definition
  - model_errors_for_region_definition

required_run_metadata:
  - protocol_freeze_id
  - split_manifest_path
  - split_manifest_sha256
  - adaptation_setting
  - target_train_dates_hash
  - target_eval_dates_hash
  - target_val_dates_hash_if_used
  - method
  - trainable_parameter_count
  - adaptation_steps
  - normalization_source
  - model_selection_source

paper_protocol_note: >-
  For each held-out target continent, train source-domain models on source
  years 2015-2021, select checkpoints and hyperparameters only on source-domain
  year 2022, construct target-specific operators using the full held-out target
  historical training period in 2015-2021, optionally validate target adaptation
  on preregistered target year 2022, and report final metrics exclusively on
  target years 2023-2025. Legacy K=0/4/12 support-cycle experiments are reported only as
  secondary few-shot ablations.
