protocol_name: HydroDA-OOD-HyperDA-V4
protocol_version: v4.4-zero-few-shot-generalization
protocol_freeze_id: hyperda_v4_4_zero_few_shot_generalization_2015_2025_context2015_2021_sourceval2022_eval2023_2025
objective: neural_land_DA_increment_emulation
not_objective:
  - generic_soil_moisture_prediction
  - true_soil_moisture_estimation

main_change_from_v4_3: >-
  Target-domain generalization is now zero/few-shot. Target 2015-2021
  input-side data build a context prompt; K in {0,4,12} controls the labeled
  target support budget. Target validation is unused in the main protocol.
  Source validation year 2022 remains the preregistered checkpoint and
  hyperparameter selection source, and final metrics remain restricted to
  target_eval 2023-2025. Current paper-facing claims prioritize K=0 HyperDA
  Operator Generator and HyperDA-TRUST; K=4/K=12 SAFE rows are diagnostic /
  future-extension evidence unless accepted updates are explicitly shown.

periods:
  # Backward-compatible alias used by some existing scripts.
  # Paper-facing text should call this source_fit/train.
  source_train:
    start: '2015-01-01'
    end: '2021-12-31'
    alias_of: source_fit
    allowed_usage:
      - training_shared_backbone
      - training_source_only_backbone
      - training_source_operator_episode_bank
      - source_fit_normalization
  source_fit:
    start: '2015-01-01'
    end: '2021-12-31'
    allowed_usage:
      - training_shared_backbone
      - training_source_only_backbone
      - training_source_operator_episode_bank
      - source_fit_normalization
  source_val:
    start: '2022-01-01'
    end: '2022-12-31'
    domain_constraint: source_continents_only
    allowed_usage:
      - checkpoint_selection
      - early_stopping
      - hyperparameter_selection
      - architecture_selection
      - source_val_residual_gain_calibration
    forbidden_usage:
      - target_adaptation_fit
      - final_evaluation
      - normalization
  target_context:
    start: '2015-01-01'
    end: '2021-12-31'
    aliases: [target_train_legacy]
    domain_constraint: held_out_target_continent_only
    allowed_usage:
      - target_prompt_summary_input_side_only
      - generated_parameter_conditioning_input_side_only
    forbidden_usage:
      - target_label_training
      - target_label_gain_calibration
      - checkpoint_selection
      - early_stopping
      - final_evaluation
  target_support:
    start: '2015-01-01'
    end: '2021-12-31'
    domain_constraint: held_out_target_continent_only
    K_values: [0, 4, 12]
    allowed_usage:
      - few_shot_lightweight_target_variable_tuning
    forbidden_usage:
      - source_backbone_training
      - source_operator_episode_bank_training
      - global_normalization
      - checkpoint_selection
      - early_stopping
      - hyperparameter_selection
      - architecture_selection
      - final_evaluation
  target_val:
    start: '2022-01-01'
    end: '2022-12-31'
    domain_constraint: held_out_target_continent_only
    allowed_usage:
      - unused_in_main_protocol
    forbidden_usage:
      - source_backbone_training
      - source_operator_episode_bank_training
      - global_normalization
      - target_side_selection
      - early_stopping
      - residual_gain_calibration
      - final_evaluation
  target_eval:
    start: '2023-01-01'
    end: '2025-12-31'
    aliases: [target_query]
    domain_constraint: held_out_target_continent_only
    allowed_usage:
      - final_offline_evaluation_only
    forbidden_usage:
      - training
      - target_adaptation
      - prompt_construction
      - normalization
      - adaptation_sample_selection
      - early_stopping
      - model_selection
      - hyperparameter_selection
      - threshold_calibration
      - prompt_feature_tuning
      - region_definition

main_adaptation_settings:
  - zero_shot_context
  - few_shot_k4
  - few_shot_k12

main_K_values: [0, 4, 12]

adaptation_setting_definitions:
  zero_shot_context:
    K: 0
    target_label_budget: none
    target_context: target_context_input_side_only
  few_shot_k4:
    K: 4
    target_label_budget: up_to_4_labeled_target_DA_cycles
    support_sampling: one_valid_cycle_per_season_from_2015_2021
  few_shot_k12:
    K: 12
    target_label_budget: up_to_12_labeled_target_DA_cycles
    support_sampling: one_valid_cycle_per_month_from_2015_2021

legacy_full_target_train:
  status: legacy_internal_explicit_opt_in_only
  setting: target_full_train
  target_label_budget: all_labeled_target_DA_cycles_in_target_train_period
  notes: >-
    Retained for historical reproduction only; not a default script,
    main-table setting, or paper narrative.

zero_few_shot_sampling:
  K_values: [0, 4, 12]
  context_period: 2015-2021
  support_period: 2015-2021
  target_eval_period: 2023-2025
  support_sampling:
    K0: no_target_analysis_labels_input_side_prompt_only
    K4: one_valid_cycle_per_season_from_target_context_period
    K12: one_valid_cycle_per_month_from_target_context_period
    notes: >-
      Selection may inspect calendar, time availability, and base_valid
      coverage only; never analysis increments, model errors, target_eval
      labels, or target_eval statistics.

source_training_policy:
  main: use_source_fit_2015_2021_and_source_val_2022
  rationale: >-
    Source validation year 2022 remains reserved for checkpoint, early stopping,
    hyperparameter, and architecture selection. Source fit expands through 2021
    to match the target historical adaptation window while keeping 2022 as the
    clean validation gate.
  secondary_ablation_allowed:
    - expanded_source_fit_2015_2022_extra_data_ablation

leave_one_continent_out:
  - source: [US, CN]
    target: AU
  - source: [US, AU]
    target: CN
  - source: [CN, AU]
    target: US

leakage_forbidden:
  - target_eval_labels_for_training
  - target_eval_labels_for_prompt_construction
  - target_eval_labels_for_normalization
  - target_eval_labels_for_adaptation_sample_selection
  - target_eval_labels_for_early_stopping
  - target_eval_labels_for_model_selection
  - target_eval_labels_for_hyperparameter_selection
  - target_eval_labels_for_threshold_calibration
  - target_eval_labels_for_prompt_feature_tuning
  - analysis_increments_for_region_definition
  - model_errors_for_region_definition

required_run_metadata:
  - protocol_freeze_id
  - split_manifest_path
  - split_manifest_sha256
  - adaptation_setting
  - adapt_recipe
  - anchor_alpha
  - target_context_dates_hash
  - target_context_prompt_state
  - target_support_dates_hash
  - target_support_dates
  - target_eval_dates_hash
  - target_val_usage
  - method
  - trainable_parameter_count
  - adaptation_steps
  - lr
  - support_final_loss
  - support_loss_delta
  - target_parameter_l2_drift
  - normalization_source
  - model_selection_source

paper_protocol_note: >-
  For each held-out target continent, train source-domain models on source
  years 2015-2021, select checkpoints and hyperparameters only on source-domain
  year 2022, construct target-context monthly prompt prototypes from held-out
  target 2015-2021 input-side context, generate K=0 target-specific operators,
  optionally apply source-manifold trust routing without target labels, and
  report final metrics exclusively on target years 2023-2025. K=4/K=12 SAFE
  support-cycle runs are diagnostic/future-extension paths and must expose
  rejected_to_k0_anchor when updates are rejected. Target validation and
  full-target-train adaptation are unused in the main protocol. Month is a
  deployment-known month-of-year seasonal phase selector, not an absolute date
  label or model-selection signal.
