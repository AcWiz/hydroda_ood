method_name: HyperDA-TRUST
method_version: v4.0
paper_name: "HyperDA-TRUST: Source-Manifold Trust-Routed Operator Generation"

backbone:
  first_version: SmallResUNet
  alternatives:
    - ConvNeXt_UNet
  avoid_first:
    - large_transformer
    - sformer_wrapper

parameter_generation:
  generate_full_backbone: false
  generated_blocks:
    - adapter_parameters
    - output_head_residual
    - optional_film_parameters
  factorization: basis_factorized
  formula: zeta_R_l = zeta_0_l + sum_m alpha_R_l_m * B_l_m
  active_ablation_modules:
    - shared_layer_aware_rank_gated_coefficients
    - dora_like_identity_centered_basis_gain
    - source_calibrated_layer_basis_saliency_gate_prior
  default_ablation_preset: M2_1_rank_gated_dora_stable
  main_source_prior:
    ablation_id: M2_1_rank_gated_dora_stable
    paper_method_phrase: HyperDA Operator Generator with stable rank-gated bounded-DoRA lightweight operator generation
    hyper_coeff_generator: shared_layer_aware_rank_gated_stable
    hyper_adapter_param_style: dora_like_gain_bounded
    hyper_rank_gate_temperature_init: 2.0
    use_amp: 0
    lr: 2e-4
    status: paper_facing_zero_shot_operator_generator
  rank_gated_defaults:
    hyper_coeff_generator: shared_layer_aware_rank_gated
    hyper_rank_gate_top_k: 4
    hyper_rank_gate_temperature_init: 1.0
    hyper_adapter_param_style: dora_like_gain
    hyper_reliability_gate: prompt_scalar
  source_saliency_prior_defaults:
    ablation_id: M2_2_source_saliency_prior
    status: secondary diagnostic
    saliency_source_allowed:
      - source_fit
      - source_side_pseudo_episodes
    forbidden_saliency_sources:
      - source_val_for_training_saliency
      - target_val
      - target_eval
    prior_shape: adapter_layer_by_basis
    injection: legacy_gate_logit_bias_before_top_k_diagnostic_only
    beta_selection: fixed_or_source_side_preregistered
    prompt_manifold_reliability: input_side_context_features_only
  source_safe_residual_defaults:
    ablation_id: M2_3_source_safe_residual_hyperda
    status: negative_diagnostic_source_safe_residual_ablation
    mainline_status: do_not_replace_m2_1_current_us_r1_k0_target_eval_worse
    starts_from: M2_1_rank_gated_dora_stable
    zero_shot_prior_form: source_base_residual_reliability_gated
    formula: pred = source_base(x) + rho * reliability_gate(prompt, context) * hyper_residual(x, prompt)
    rho_selection: source_val_regionwise_safe_episode_only
    target_val_usage: unused_in_main_protocol
    target_labels_used_for_adaptation: false
    saliency_prior_application: soft_regularization_metadata_no_hard_topk_routing
    regularizers:
      - residual_magnitude_penalty
      - coefficient_entropy_floor
  da_aware_prompt_only_defaults:
    ablation_id: M2_5a_da_aware_prompt_only
    status: negative_diagnostic_non_strict_prompt_only
    starts_from: M2_1_rank_gated_dora_stable
    failure_interpretation: source_val_improved_target_k0_degraded
    non_strict_contrast_reasons:
      - operator_form_was_direct_hyper_rho0_not_m2_1_source_base_residual_anchor
      - normalized_domain_tb_innovation_not_physical_raw_innovation
    hyper_coeff_generator: shared_layer_aware_rank_gated_stable
    hyper_adapter_param_style: dora_like_gain_bounded
    hyper_rank_gate_top_k: 4
    hyper_rank_gate_temperature_init: 2.0
    use_amp: 0
    lr: 2e-4
    context_encoder: robust_input_side_da_diagnostics
    prompt_feature_source: input_side_target_context_or_current_input_only
    prompt_diagnostics:
      - tb_h_v_innovation
      - observation_error_confidence
      - h_v_polarization_contrast
      - mwrtm_vegopacity
      - soil_and_surface_temperature
      - forecast_surface_rootzone_state
      - finite_input_coverage
      - bounded_base_valid_mask_diagnostic_coverage
    forbidden_sources:
      - target_labels
      - target_val
      - target_eval_statistics
    base_valid_mask_usage: bounded_diagnostic_feature_only_not_loss_metric_obs_or_region_mask
  da_aware_conservative_router_defaults:
    ablation_id: M2_5b_da_aware_conservative_router
    status: diagnostic_not_paper_main_until_source_and_target_eval_gates_pass
    starts_from: M2_1_rank_gated_dora_stable
    hyper_coeff_generator: shared_layer_aware_rank_gated_stable
    hyper_adapter_param_style: dora_like_gain_bounded
    hyper_rank_gate_top_k: 4
    hyper_rank_gate_temperature_init: 2.0
    use_amp: 0
    lr: 2e-4
    context_encoder: robust_input_side_da_diagnostics_raw
    prompt_diagnostic_input_domain: raw_input_side
    backbone_input_domain: normalized_x_norm
    zero_shot_prior_form: source_base_residual_reliability_gated
    source_residual_rho: 1.0
    source_residual_gate_init: 0.90
    hyper_prompt_manifold_reliability: 1
    hyper_prompt_manifold_reliability_strength: 0.25
    m2_5a_failure_interpretation: source_val_improved_target_k0_degraded
    promotion_rule: source_val_gate_then_final_target_eval_only
    forbidden_sources:
      - target_labels
      - target_val
      - target_eval_statistics
    base_valid_mask_usage: bounded_diagnostic_feature_only_not_loss_metric_obs_or_region_mask
  source_manifold_guarded_prior_defaults:
    ablation_id: M2_6_source_manifold_guarded_prior
    status: diagnostic_source_manifold_guarded_prior_not_paper_main_until_gates_pass
    starts_from: M2_1_rank_gated_dora_stable
    context_encoder: current_mean_std
    hyper_coeff_generator: shared_layer_aware_rank_gated_stable
    hyper_adapter_param_style: dora_like_gain_bounded
    hyper_rank_gate_top_k: 4
    hyper_rank_gate_temperature_init: 2.0
    use_amp: 0
    lr: 2e-4
    zero_shot_prior_form: source_base_residual_reliability_gated
    source_residual_rho: 1.0
    source_residual_gate_init: 0.95
    hyper_source_manifold_guard: 1
    hyper_source_manifold_guard_distance_key: source_manifold_distance_bounded
    source_manifold_guard_calibration: source_fit_source_val_only
    target_eval_usage: final_eval_only_no_selection
    guard_scope: adapter_and_hyper_residual_branch_only_not_frozen_source_base
    promotion_rule: source_gate_then_single_final_k0_target_eval_only
    forbidden_sources:
      - target_labels
      - target_val
      - target_eval_statistics
  hyperda_trust_defaults:
    method_family: HyperDA-TRUST
    paper_phrase: Source-Manifold Trust-Routed Operator Generation
    status: current_zero_shot_regularization_module
    starts_from: M2_1_rank_gated_dora_stable
    contrast_to_m2_6: routes_coefficients_to_source_neighborhood_consensus_instead_of_scalar_residual_shrink_only
    source_trust_bank:
      source: source_fit_source_val_only
      label_usage: none
      target_eval_usage: final_eval_only_no_selection
      contents:
        - source_prompt_embeddings
        - nearest_source_distance_quantiles
        - source_neighborhood_coefficient_consensus
    default_top_m: 4
    trust_blend_formula: coeff_star = tau_layer * coeff_target_prompt + (1 - tau_layer) * coeff_source_neighbor_consensus
    variable_gate: surface_rootzone_separate_residual_gate
    selection_metric: source_val_dual_variable_cvar_safe_score
    candidates:
      M3_0_hyperda_trust_light:
        trust_strength: 0.25
        variable_gate: true
      M3_1_hyperda_trust_medium:
        trust_strength: 0.50
        variable_gate: true
        status: current_us_r1_k0_paper_facing_hyperda_trust_candidate
        evidence_card: reports/experiments/M3_1_plus_us_r1_seed0_ablation_decision_20260621.md
      M3_1a_trust_medium_dualalpha:
        trust_strength: 0.50
        source_neighbor_top_m: 4
        variable_gate: true
        alpha_selection_objective: dual_variable_cvar_safe_score
        status: negative_or_neutral_preregistered_ablation_do_not_promote
        evidence_card: reports/experiments/M3_1_plus_us_r1_seed0_ablation_decision_20260621.md
      M3_1b_trust_mid_high:
        trust_strength: 0.375
        source_neighbor_top_m: 4
        variable_gate: true
        alpha_selection_objective: dual_variable_cvar_safe_score
        status: negative_or_neutral_preregistered_ablation_do_not_promote
        evidence_card: reports/experiments/M3_1_plus_us_r1_seed0_ablation_decision_20260621.md
      M3_1c_trust_medium_local:
        trust_strength: 0.50
        source_neighbor_top_m: 2
        variable_gate: true
        alpha_selection_objective: dual_variable_cvar_safe_score
        status: negative_or_neutral_preregistered_ablation_do_not_promote
        evidence_card: reports/experiments/M3_1_plus_us_r1_seed0_ablation_decision_20260621.md
      M3_1d_trust_medium_broad:
        trust_strength: 0.50
        source_neighbor_top_m: 6
        variable_gate: true
        alpha_selection_objective: dual_variable_cvar_safe_score
        optional_budget: true
        status: do_not_run_as_strict_evidence_after_us_r1_target_eval_unless_exploratory
        evidence_card: reports/experiments/M3_1_plus_us_r1_seed0_ablation_decision_20260621.md
      M3_2_hyperda_trust_raw_reliability:
        trust_strength: 0.25
        context_encoder: current_mean_std
        source_trust_query_mode: raw_input_side_da_diagnostics
        raw_diagnostics_usage: trust_features_only_not_main_prompt_replacement
      M3_2_phys_trust_raw_da_query:
        alias_of: M3_2_hyperda_trust_raw_reliability
        status: source_gated_ablation_not_paper_main_until_gates_pass
        trust_strength: 0.25
        context_encoder: current_mean_std
        source_trust_query_mode: raw_input_side_da_diagnostics
        raw_diagnostics_usage: trust_features_only_not_main_prompt_replacement
        phys_trust_d0_summary: required_diagnostic_only
      M3_4_phys_trust_blended_query:
        status: negative_diagnostic_do_not_continue_query_space_replacement
        trust_strength: 0.25
        context_encoder: current_mean_std
        source_trust_query_mode: blended_prompt_raw_da_0p25
        failure_interpretation: blended_physical_query_neighbor_geometry_degraded_us_r1_k0_target_eval
        target_eval_usage: negative_diagnostic_only_no_tuning
      M3_5_phys_agreement_guarded_trust:
        status: source_gated_diagnostic_candidate_not_paper_main_until_gates_pass
        starts_from: M3_1_hyperda_trust_medium
        trust_strength: 0.50
        source_neighbor_top_m: 4
        context_encoder: current_mean_std
        source_trust_query_mode: raw_input_side_da_diagnostics
        trust_routing_geometry: prompt_embedding
        phys_trust_usage: guard_only_shrink_no_enhance
        phys_guard_reads:
          - x
          - x_raw
          - month
          - region_mask
        effective_strength_rule: keep_m3_1_when_prompt_and_phys_neighbors_agree_else_shrink_trust_and_source_residual_only
        source_val_gate: reject_if_dual_variable_cvar_more_than_0.005_below_M3_1
        target_eval_usage: final_eval_only_no_selection
      M3_5b_phys_agreement_floor_guard:
        status: source_gated_low_complexity_redesign_after_m3_5_early_stop
        starts_from: M3_1_hyperda_trust_medium
        trust_strength: 0.50
        source_neighbor_top_m: 4
        context_encoder: current_mean_std
        source_trust_query_mode: raw_input_side_da_diagnostics
        trust_routing_geometry: prompt_embedding
        phys_trust_usage: guard_only_bounded_shrink_no_enhance
        phys_guard_risk_rule: and
        phys_guard_min_multiplier: 0.8
        effective_strength_rule: keep_m3_1_unless_prompt_phys_disagreement_and_raw_physical_ood_cooccur_then_shrink_at_most_20_percent
        source_val_gate: reject_if_dual_variable_cvar_more_than_0.005_below_M3_1
        target_eval_usage: final_eval_only_no_selection
      M3_6_phys_token_operator_droppath_trust:
        status: source_gated_stage2_candidate_after_m3_5b
        starts_from: M3_1_hyperda_trust_medium
        trust_strength: 0.50
        source_neighbor_top_m: 4
        context_encoder: current_mean_std
        trust_routing_geometry: prompt_embedding
        source_trust_query_mode: prompt_embedding
        phys_context_source: raw_input_side_da_diagnostics
        phys_token_usage: operator_coefficient_delta_only
        phys_delta_scale: 0.25
        phys_gate_init: 0.90
        operator_droppath_p: 0.10
        operator_droppath_train_only: true
        initial_behavior: zero_initialized_phys_delta_head_preserves_m3_1
        first_screen:
          warm_start: M3_1_best_checkpoint
          trainable_scope: phys_context_only
          max_epochs: 5
        source_val_gate: reject_if_dual_variable_cvar_more_than_0.005_below_M3_1
        target_eval_usage: final_eval_only_no_selection
        forbidden_sources:
          - target_labels
          - target_val
          - target_eval_statistics
        base_valid_mask_usage: bounded_diagnostic_coverage_only_not_loss_metric_obs_or_region_mask
      M3_8b_phys_formula_light_guarded_trust:
        status: superseded_historical_physics_diagnostic_by_M3_14_design_handoff
        paper_method_phrase: Physics-informed HyperDA-TRUST
        design_anchor: M3_1_hyperda_trust_medium
        checkpoint_start: source_pooled_global_backbone
        not_init_from: M3_1_checkpoint_or_M2_1_checkpoint
        comparison_role: physical_enhancement_of_M3_1_not_new_baseline
        trust_strength: 0.50
        source_neighbor_top_m: 4
        context_encoder: current_mean_std
        trust_routing_geometry: prompt_embedding
        source_trust_query_mode: prompt_embedding
        phys_context_source: raw_input_side_formula_v2
        phys_formula_source: raw_input_side_formula_v2
        phys_formula_schema_version: phys_formula_operator_v2_input_side
        phys_token_usage: bounded_operator_coefficient_delta_only
        phys_delta_scale: 0.05
        phys_gate_init: 0.35
        operator_droppath_p: 0.10
        operator_droppath_train_only: true
        initial_behavior: zero_initialized_phys_delta_head_preserves_m3_1
        consistency_guard:
          enabled: true
          action: shrink_only_high_floor_variable_trust_gate
          min_surface: 0.985
          min_rootzone: 0.99
          strength_surface: 0.02
          strength_rootzone: 0.01
        first_screen:
          region: US-R1
          seed: 0
          K: 0
          initialization: source_only_checkpoint_clean_hypernetwork_training
          warm_start: none
          prompt_checkpoint_warm_start: none_for_clean_physics_candidate
          trainable_scope: source_base_frozen_adapter_film
          max_epochs: 50
          eval_every_epochs: 5
          lr: 2e-4
          use_amp: 0
          batch_size: 64
          accum_steps: 2
          target_eval_usage: not_run_during_source_selection
        source_val_selection_rule: source_val_dual_variable_cvar_safe_score >= M3_1 - 0.005; choose highest passing source safe score; tie within 0.0005 chooses smaller worst relative source_val RMSE degradation
        target_eval_acceptance: improve_at_least_one_target_eval_RMSE_variable_and_other_degrades_lte_0.2pct_or_both_degrade_lte_0.2pct_else_diagnostic_if_any_degrades_gt_0.5pct
        target_eval_usage: final_eval_only_no_selection
        forbidden_sources:
          - target_labels
          - target_val
          - target_eval_statistics
        base_valid_mask_usage: bounded_diagnostic_coverage_only_not_loss_metric_obs_or_region_mask
      M3_8c_phys_formula_light_operator_only_trust:
        status: superseded_historical_operator_only_guard_ablation_by_M3_14_design_handoff
        paper_method_phrase: Physics-informed HyperDA-TRUST operator-only guard ablation
        design_anchor: M3_1_hyperda_trust_medium
        checkpoint_start: source_pooled_global_backbone
        not_init_from: M3_1_checkpoint_or_M2_1_checkpoint
        comparison_role: diagnose_whether_consistency_guard_causes_RMSE_harm
        trust_strength: 0.50
        source_neighbor_top_m: 4
        context_encoder: current_mean_std
        trust_routing_geometry: prompt_embedding
        source_trust_query_mode: prompt_embedding
        phys_context_source: raw_input_side_formula_v2
        phys_formula_source: raw_input_side_formula_v2
        phys_formula_schema_version: phys_formula_operator_v2_input_side
        phys_token_usage: bounded_operator_coefficient_delta_only
        phys_delta_scale: 0.05
        phys_gate_init: 0.35
        operator_droppath_p: 0.10
        operator_droppath_train_only: true
        initial_behavior: zero_initialized_phys_delta_head_preserves_m3_1
        consistency_guard:
          enabled: false
          env: HYPER_PHYS_CONSISTENCY_GUARD=0
        first_screen:
          region: US-R1
          seed: 0
          K: 0
          initialization: source_only_checkpoint_clean_hypernetwork_training
          warm_start: none
          prompt_checkpoint_warm_start: none_for_clean_physics_candidate
          trainable_scope: source_base_frozen_adapter_film
          max_epochs: 50
          eval_every_epochs: 5
          lr: 2e-4
          use_amp: 0
          batch_size: 64
          accum_steps: 2
          target_eval_usage: not_run_during_source_selection
        source_val_selection_rule: source_val_dual_variable_cvar_safe_score >= M3_1 - 0.005; choose highest passing source safe score; tie within 0.0005 chooses smaller worst relative source_val RMSE degradation
        target_eval_acceptance: improve_at_least_one_target_eval_RMSE_variable_and_other_degrades_lte_0.2pct_or_both_degrade_lte_0.2pct_else_diagnostic_if_any_degrades_gt_0.5pct
        target_eval_usage: final_eval_only_no_selection
        forbidden_sources:
          - target_labels
          - target_val
          - target_eval_statistics
        base_valid_mask_usage: bounded_diagnostic_coverage_only_not_loss_metric_obs_or_region_mask
      M3_9_phys_formula_enhanced_trust:
        status: superseded_historical_physics_diagnostic_by_M3_14_design_handoff
        starts_from: M3_1_hyperda_trust_medium
        trust_strength: 0.50
        source_neighbor_top_m: 4
        context_encoder: current_mean_std
        trust_routing_geometry: prompt_embedding
        source_trust_query_mode: prompt_embedding
        phys_context_source: raw_input_side_formula_v3_enhanced
        phys_formula_source: raw_input_side_formula_v3_enhanced
        phys_formula_schema_version: phys_formula_operator_v2_enhanced_input_side
        phys_token_usage: bounded_operator_coefficient_delta_only
        phys_delta_scale: 0.05
        phys_gate_init: 0.35
        operator_droppath_p: 0.10
        operator_droppath_train_only: true
        initial_behavior: zero_initialized_phys_delta_head_preserves_m3_1
        consistency_guard:
          enabled: true
          action: shrink_only_high_floor_variable_trust_gate
          min_surface: 0.98
          min_rootzone: 0.99
        first_screen:
          warm_start: M3_1_best_checkpoint
          trainable_scope: phys_formula_context_only
          max_epochs: 3
          lr: 1e-4
          use_amp: 0
          source_fit_max_batches_per_epoch: 384
          target_eval_usage: not_run_during_screening
        selection_rule: cap384_select_best_rootzone_if_dual_cvar_within_0.0005_of_M3_8_V1_and_surface_degrade_lte_0.2pct_else_stop
        full_confirmation_gate: dual_cvar_gte_0.441573390549_surface_rootzone_rmse_degrade_lte_0.5pct_vs_M3_1_leakage_clean
        target_eval_usage: final_eval_only_no_selection
        forbidden_sources:
          - target_labels
          - target_val
          - target_eval_statistics
        base_valid_mask_usage: bounded_diagnostic_coverage_only_not_loss_metric_obs_or_region_mask
      M3_10a_da_gain_router_lite:
        status: exploratory_after_us_r1_target_eval_seen_not_paper_main
        starts_from: M3_1_hyperda_trust_medium
        neural_training_epochs: 0
        neural_parameter_updates: 0
        source_gain_bank:
          source: source_fit_labels_only
          grouping: source_region_by_month
          formula:
            d_H: (TB_H_obs - TB_H_assim) / (obs_err_H + eps)
            d_V: (TB_V_obs - TB_V_assim) / (obs_err_V + eps)
            G_vpm: Cov_source(DeltaSM_v, d_p) / (Var_source(d_p) + lambda)
            C_rz: Cov_source(DeltaSM_rootzone, DeltaSM_surface) / (Var_source(DeltaSM_surface) + lambda)
        inference:
          action: post_hoc_bounded_increment_blend
          eta_grid: [0.0, 0.025, 0.05, 0.10]
          eta_selection_source: source_val_only
          target_fallback: source_month_consensus
        source_val_gate:
          dual_variable_cvar_delta_gte: -0.005
          rmse_degrade_lte_relative: 0.002
          requires_corr_or_sign_gain: true
        target_eval_usage: exploratory_final_eval_only_no_selection
        forbidden_sources:
          - target_labels_for_bank
          - target_val
          - target_eval_statistics_for_bank_or_eta_selection
      M3_11_signed_da_gain_residual_trust:
        status: superseded_historical_post_hoc_gain_diagnostic_by_M3_14_design_handoff
        starts_from: M3_1_hyperda_trust_medium
        design_reason: after_M3_8b_8c_source_gate_too_weak_use_signed_TB_innovation_DA_gain_residual
        neural_training_epochs: 0
        neural_parameter_updates: 0
        base_anchor_frozen: true
        gain_bank_schema: m3_11_source_signed_da_gain_bank_v1
        source_gain_bank:
          source: source_fit_labels_only
          grouping: source_region_by_month
          source_split_roles:
            bank: [source_fit]
            eta_selection: [source_val]
          formula:
            d_H: (tb_h_obs - tb_h_obs_assim) / (tb_h_obs_errstd + eps)
            d_V: (tb_v_obs - tb_v_obs_assim) / (tb_v_obs_errstd + eps)
            G_v_p: Cov_source(DeltaSM_v, d_p) / (Var_source(d_p) + lambda)
            C_rz: Cov_source(DeltaSM_rootzone, DeltaSM_surface) / (Var_source(DeltaSM_surface) + lambda)
        inference:
          action: bounded_residual_blend_around_frozen_M3_1
          q_surface: clip(G_s_H*d_H + G_s_V*d_V)
          q_rootzone: clip(G_r_H*d_H + G_r_V*d_V + C_rz*q_surface)
          final: pred_v = pred_M3_1_v + eta_v * conf_v(x) * clip(q_v - pred_M3_1_v)
          eta_grid: [0.0, 0.025, 0.05, 0.10]
          eta_selection_source: source_val_only
          eta_zero_contract: exact_M3_1_prediction_identity
          gain_source_priority:
            - source_trust_top_m_neighbor_weighted_consensus
            - source_month_consensus
            - source_global_consensus
        first_screen:
          region: US-R1
          purpose: source_only_sanity_debug_no_US_R1_target_eval_as_main_evidence
        paper_eligible_screen:
          status: canceled_by_M3_14_US_R1_only_physics_ablation_policy
          former_region: US-R2
          note: US-R2_to_US-R6_deferred_until_M3_14_method_freeze
        source_val_gate:
          requires_positive_eta: true
          dual_variable_cvar_delta_gte: 0.002
          variable_rmse_degrade_lte_relative: 0.001
          source_region_rmse_degrade_lte_relative: 0.005
          requires_corr_or_sign_nondecline: true
        target_eval_acceptance:
