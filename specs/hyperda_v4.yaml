method_name: HyperDA
method_version: v4.0

backbone:
  first_version: SmallResUNet
  alternatives:
    - ConvNeXt_UNet
  avoid_first:
    - large_transformer
    - sformer_wrapper

parameter_generation:
  generate_full_backbone: false
  generated_blocks:
    - adapter_parameters
    - output_head_residual
    - optional_film_parameters
  factorization: basis_factorized
  formula: zeta_R_l = zeta_0_l + sum_m alpha_R_l_m * B_l_m

prompt:
  token_types:
    - STATIC
    - SPATIAL_OBS
    - MONTHLY_TEMPORAL
    - CALIBRATION
    - NO_CALIBRATION
  forbidden_features:
    - continent_embedding_for_main
    - regime_id_for_main
    - target_eval_statistics
    - target_eval_labels
    - target_query_statistics  # deprecated alias
    - target_query_labels  # deprecated alias

variants:
  HyperDA_FullTargetTrain:
    labels: all_labeled_target_train_cycles_2015_2021
    prompt: target_2015_2021_input_side_spatial_temporal_prompt_plus_full_train_summary_tokens
    generated_parameters: target_specific_lightweight_operator
  HyperDA_Refine_FullTargetTrain:
    initialization: HyperDA_generated_zeta_from_full_target_train_prompt
    frozen:
      - theta0
      - H_psi
      - adapter_basis_bank
    trainable:
      - target_latent
      - adapter_coefficient_residuals
      - lightweight_operator_residual
      - output_head_residual
      - residual_gain
    adaptation_data: full_target_train_2015_2021
    selection_data: target_val_2022_preregistered_adaptation_selection_only
    final_eval_data: target_eval_2023_2025_offline_only
    steps: fixed_pre_registered
  legacy_HyperDA_Zero:
    status: secondary_few_shot_ablation
    labels: none
    prompt: target_input_side_spatial_temporal_prompt
  legacy_HyperDA_Calib:
    status: secondary_few_shot_ablation
    labels: K_labeled_target_train_calibration_cycles
    K: [4, 12]
    prompt: input_side_prompt_plus_calibration_summary_tokens

loss:
  DA_loss: masked_balanced_Huber
  hyperda_terms:
    L_func: 1.0
    L_param: 0.05
    L_prior: 0.0001
    L_coeff: 0.0001
